<div class="flex h-svh overflow-hidden bg-gray-100 text-gray-800">
  <aside
    class="fixed inset-y-0 left-0 z-40 flex h-svh w-60 flex-col border-r border-gray-800 bg-gray-900 text-gray-300 transition-transform duration-200 lg:static lg:translate-x-0"
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="!sidebarOpen()"
    aria-label="Navegación principal"
  >
    <div class="border-b border-gray-800 px-4 pb-3 pt-5">
      <div class="text-lg font-bold text-white">Flotilla</div>
      <p class="mt-0.5 text-xs text-gray-400">Panel de control</p>
    </div>

    <nav class="flex flex-1 flex-col gap-0.5 overflow-y-auto px-3 py-4">
      <p class="mb-1.5 px-2.5 text-[11px] font-semibold uppercase tracking-wide text-gray-500">
        Módulos
      </p>

      <a
        routerLink="/"
        routerLinkActive="border-l-blue-500 bg-gray-800 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-md border-l-[3px] border-l-transparent px-3 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-800 hover:text-white"
      >
        Inicio
      </a>
      <a
        routerLink="/usuarios"
        routerLinkActive="border-l-blue-500 bg-gray-800 text-white"
        class="rounded-md border-l-[3px] border-l-transparent px-3 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-800 hover:text-white"
      >
        Usuarios
      </a>
      <a
        routerLink="/pedidos"
        routerLinkActive="border-l-blue-500 bg-gray-800 text-white"
        class="rounded-md border-l-[3px] border-l-transparent px-3 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-800 hover:text-white"
      >
        Pedidos
      </a>
      <a
        routerLink="/rutas"
        routerLinkActive="border-l-blue-500 bg-gray-800 text-white"
        class="rounded-md border-l-[3px] border-l-transparent px-3 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-800 hover:text-white"
      >
        Rutas
      </a>
    </nav>

    <div class="grid gap-2.5 border-t border-gray-800 p-3.5">
      @if (auth.user(); as user) {
        <div class="flex min-w-0 items-center gap-2.5">
          <div
            class="grid h-8 w-8 shrink-0 place-items-center rounded-md bg-gray-700 text-sm font-semibold uppercase text-white"
          >
            {{ user.nombre.charAt(0) }}
          </div>
          <div class="min-w-0">
            <strong class="block truncate text-sm text-white">{{ user.nombre }}</strong>
            <span class="block text-xs capitalize text-gray-400">{{ user.rol }}</span>
          </div>
        </div>
      }
      <button
        type="button"
        class="w-full rounded-md border border-gray-700 px-3 py-2 text-sm font-medium text-gray-200 hover:bg-gray-800"
        (click)="auth.logout()"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  @if (sidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 border-0 bg-gray-900/45 lg:hidden"
      (click)="closeSidebar()"
      aria-label="Cerrar menú"
    ></button>
  }

  <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">
    <header
      class="sticky top-0 z-10 flex h-12 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-4 lg:hidden"
    >
      <button
        type="button"
        class="inline-flex h-9 w-9 flex-col items-center justify-center gap-1 rounded-md border border-gray-200 bg-white"
        (click)="toggleSidebar()"
        aria-label="Abrir menú"
      >
        <span class="block h-0.5 w-4 bg-gray-700"></span>
        <span class="block h-0.5 w-4 bg-gray-700"></span>
        <span class="block h-0.5 w-4 bg-gray-700"></span>
      </button>
      <span class="text-sm font-semibold">Flotilla</span>
    </header>

    <main class="mx-auto w-full max-w-[1100px] flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-5">
      <router-outlet />
    </main>
  </div>
</div>
