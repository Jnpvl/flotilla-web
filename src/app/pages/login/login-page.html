<section
  class="relative grid min-h-svh place-items-center overflow-y-auto px-4 py-6 sm:px-6 sm:py-10"
>
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_20%_10%,#007a92_0%,transparent_45%),radial-gradient(ellipse_at_90%_80%,#003844_0%,transparent_50%),linear-gradient(160deg,#003844_0%,#005f71_48%,#004a59_100%)]"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute inset-0 opacity-[0.07] [background-image:linear-gradient(rgba(255,255,255,0.35)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.35)_1px,transparent_1px)] [background-size:28px_28px]"
    aria-hidden="true"
  ></div>

  <div class="relative z-10 w-full max-w-sm sm:max-w-md">
    <header class="mb-6 text-center text-white sm:mb-8">
      <div
        class="mx-auto grid h-20 w-20 place-items-center rounded-2xl bg-white p-2.5 shadow-sm sm:h-24 sm:w-24 sm:p-3"
      >
        <img
          src="/brand/logo.png"
          alt="Promacson"
          width="88"
          height="88"
          class="block h-full w-full object-contain"
        />
      </div>
      <p class="mt-4 m-0 text-2xl font-bold tracking-tight sm:mt-5 sm:text-4xl">
        Promacson
      </p>
      <h1 class="mt-3 m-0 text-sm font-medium text-white/85 sm:mt-4 sm:text-base">
        Accede a tu panel de operaciones
      </h1>
    </header>

    <form
      class="grid gap-3.5 rounded-xl border border-white/15 bg-white/95 p-4 shadow-[0_20px_50px_rgba(0,32,40,0.35)] backdrop-blur-sm sm:p-6"
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <label class="grid gap-1">
        <span class="text-xs font-medium text-brand-800">Usuario</span>
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="tu.usuario"
          class="w-full rounded-md border border-brand-200 bg-white px-3 py-2.5 text-base text-gray-900 outline-none focus:border-brand-600 focus:ring-3 focus:ring-brand-600/20 sm:text-sm"
        />
      </label>

      <label class="grid gap-1">
        <span class="text-xs font-medium text-brand-800">Contraseña</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          class="w-full rounded-md border border-brand-200 bg-white px-3 py-2.5 text-base text-gray-900 outline-none focus:border-brand-600 focus:ring-3 focus:ring-brand-600/20 sm:text-sm"
        />
      </label>

      @if (error()) {
        <p class="m-0 text-sm text-red-700" role="alert">{{ error() }}</p>
      }

      <button
        class="mt-1 w-full rounded-md bg-brand-700 px-4 py-2.5 font-semibold text-white transition hover:bg-brand-800 disabled:cursor-wait disabled:opacity-65"
        type="submit"
        [disabled]="loading()"
      >
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</section>
